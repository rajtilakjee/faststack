services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: faststack
      POSTGRES_PASSWORD: faststack
      POSTGRES_DB: faststack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faststack -d faststack"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
